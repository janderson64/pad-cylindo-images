# Production Shopify app config — used after Railway deploy.
# Replace the Railway domain below, then:
#   shopify app deploy --config shopify.app.production.toml

client_id = "21128d690914e4ca94bb1ded5b4442fa"
name = "cylindo-image-update"
application_url = "https://pad-cylindo-images-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
scopes = "read_products,write_products"

[auth]
redirect_urls = [
  "https://pad-cylindo-images-production.up.railway.app/auth/callback",
  "https://pad-cylindo-images-production.up.railway.app/auth/shopify/callback",
  "https://pad-cylindo-images-production.up.railway.app/api/auth/callback",
]
